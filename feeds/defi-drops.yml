name: defi-drops
description: "DeFi protocols holding $10M or more that lost 25% or more of their deposits (TVL) in a day - often the first sign of a hack, an exploit or a run - from DefiLlama. One item a protocol a day. Data, not investment advice."
group: Crypto
sources:
  - type: web
    url: "https://api.llama.fi/protocols"
operators:
  - {type: filter, expr: 'exists(change_1d) and change_1d != null and change_1d <= -25 and tvl >= 10000000 and category != "CEX"'}
  - type: map
    assign:
      - 'title=name + " TVL down " + round(abs(change_1d), 0) + "% in a day, to $" + short(tvl)'
      - 'summary=name + " (" + default(category, "DeFi") + ") holds $" + short(tvl) + " after a " + round(abs(change_1d), 1) + "% drop in 24 hours (DefiLlama). A sudden drop can mean a hack, an exploit or users leaving. Data, not investment advice."'
      - 'link="https://defillama.com/protocol/" + slug'
      - 'published_at="${TODAY}T00:00:00Z"'
      - 'day_key=slug + " ${TODAY}"'
  - {type: select, fields: [title, summary, link, published_at, day_key]}
  - {type: diff, key: day_key, only: [added], namespace: defi-drops, emit_initial: true}
outputs:
  - {type: feed, path: ../public/defi-drops.xml, title: "DeFi deposits down 25%+ in a day (DefiLlama)", link: "https://defillama.com/"}
  - {type: feed, path: ../public/defi-drops.json, title: "DeFi deposits down 25%+ in a day (DefiLlama)", link: "https://defillama.com/"}

name: exchange-listings
description: New and removed trading pairs on Coinbase, Binance, OKX and Upbit, read from each exchange's official market list. Data, not investment advice.
group: Crypto
sources:
  - type: web
    url: https://api.exchange.coinbase.com/products
  - type: web
    url: "https://data-api.binance.vision/api/v3/exchangeInfo?permissions=SPOT&showPermissionSets=false"
    records: symbols
  - type: web
    url: "https://www.okx.com/api/v5/public/instruments?instType=SPOT"
    records: data
  - type: web
    url: https://api.upbit.com/v1/market/all
operators:
  - type: select
    fields: [pair=display_name|instId|market|symbol, name=english_name|baseAsset|baseCcy|base_currency, quote=quoteAsset|quoteCcy|quote_currency, listed_at=listTime]
  - type: map
    assign:
      - 'exchange=replace(source_url, "^https://[a-z.-]*?(coinbase|binance|okx|upbit)\\..*$", "\\1")'
      - 'exchange=replace(replace(replace(replace(exchange, "^coinbase$", "Coinbase"), "^binance$", "Binance"), "^okx$", "OKX"), "^upbit$", "Upbit")'
      - 'title=exchange + " lists " + name + " (" + pair + ")"'
      - 'summary="A new trading pair on " + exchange + "''s public market list: " + pair + default(", " + name + " against " + quote, "") + ". New tokens are often risky; data, not investment advice."'
      - "published_at=date(listed_at)"
  - {type: map, assign: ['listing=exchange + " " + pair']}   # BTC-USD is on Coinbase and OKX both
  # The first run only records what is listed today; a state of its own since the key changed.
  - {type: diff, key: listing, only: [added, removed], namespace: exchange-listings-by-exchange}
outputs:
  - {type: feed, path: ../public/exchange-listings.xml, title: "New listings: Coinbase, Binance, OKX, Upbit"}
  - {type: feed, path: ../public/exchange-listings.json, title: "New listings: Coinbase, Binance, OKX, Upbit"}

name: world-headlines
description: World headlines from BBC, NPR and Al Jazeera, merged, newest first.
group: World and regions
sources:
  - type: rss
    url: [https://feeds.bbci.co.uk/news/world/rss.xml, https://feeds.npr.org/1001/rss.xml, https://www.aljazeera.com/xml/rss/all.xml]
operators:
  - {type: dedupe, by: [link]}
  - {type: sort, by: [published_at], reverse: true}
  - {type: diff, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/world-headlines.xml, title: "World headlines (BBC, NPR, Al Jazeera)", max_items: 150}
  - {type: feed, path: ../public/world-headlines.json, title: "World headlines (BBC, NPR, Al Jazeera)", max_items: 150}

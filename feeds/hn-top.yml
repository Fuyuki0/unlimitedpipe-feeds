name: hn-top
description: Hacker News stories that reached 300 points, the biggest discussions of the day, from the official Hacker News search API.
group: Developers
sources:
  - type: web
    url: "https://hn.algolia.com/api/v1/search_by_date?tags=story&numericFilters=points%3E300&hitsPerPage=50"
    records: hits
operators:
  - type: map
    assign: ['hn="https://news.ycombinator.com/item?id=" + objectID']
  - type: select
    fields: [title, link=url|hn, hn, published_at=created_at, points, num_comments]
  - {type: diff, key: hn, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/hn-top.xml, title: Hacker News (300+ points), link: https://news.ycombinator.com/}
  - {type: feed, path: ../public/hn-top.json, title: Hacker News (300+ points), link: https://news.ycombinator.com/}

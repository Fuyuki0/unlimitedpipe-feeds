name: us-contracts
description: "New US federal contracts of $100M or more - who won them, from which agency, and what for - biggest first, from USAspending.gov. Agencies report contracts within days of awarding them."
group: "Money, economy and government"
sources:
  - {type: usaspending, resource: contracts, min_value: 100000000, days: 14}
operators:
  - {type: diff, only: [added], namespace: us-contracts, emit_initial: true}
outputs:
  - {type: feed, path: ../public/us-contracts.xml, title: "New US federal contracts, $100M+ (USAspending)", link: "https://www.usaspending.gov/search", max_items: 200}
  - {type: feed, path: ../public/us-contracts.json, title: "New US federal contracts, $100M+ (USAspending)", link: "https://www.usaspending.gov/search", max_items: 200}

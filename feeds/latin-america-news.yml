name: latin-america-news
description: "Latin America news from BBC Latin America and MercoPress, merged, newest first."
group: World and regions
sources:
  - type: rss
    url:
      - https://feeds.bbci.co.uk/news/world/latin_america/rss.xml
      - https://en.mercopress.com/rss/
operators:
  - type: map
    assign:
      - 'outlet=replace(source_url, "^https?://(?:www\\d?\\.|en\\.|e\\.|feeds\\.)?([^/]+).*$", "\\1")'
      - 'outlet=replace(outlet, "^bbci\\.co\\.uk$", "BBC Latin America")'
      - 'outlet=replace(outlet, "^mercopress\\.com$", "MercoPress")'
      - 'title=outlet + ": " + title'
  - {type: dedupe, by: [link]}
  - {type: sort, by: [published_at], reverse: true}
  - {type: diff, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/latin-america-news.xml, title: "Latin America news (BBC, MercoPress)", max_items: 150}
  - {type: feed, path: ../public/latin-america-news.json, title: "Latin America news (BBC, MercoPress)", max_items: 150}

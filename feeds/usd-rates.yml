name: usd-rates
description: The US dollar against the baht, yen, yuan, rupee and euro once a day, from the European Central Bank's reference rates (via the Frankfurter API).
group: "Money, economy and government"
sources:
  - type: web
    url: "https://api.frankfurter.dev/v1/latest?base=USD&symbols=THB,JPY,CNY,INR,EUR"
operators:
  - type: map
    assign:
      - 'title="US dollar on " + date + ": " + rates.THB + " baht, " + rates.JPY + " yen, " + rates.CNY + " yuan, " + rates.INR + " rupees, " + rates.EUR + " euro"'
      - "published_at=date"
      - 'link="https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html"'
  - {type: diff, key: date, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/usd-rates.xml, title: US dollar exchange rates (ECB reference rates)}
  - {type: feed, path: ../public/usd-rates.json, title: US dollar exchange rates (ECB reference rates)}

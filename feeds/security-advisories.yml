name: security-advisories
description: Critical security advisories and alerts from CERT-EU, JPCERT/CC (Japan) and the Canadian Centre for Cyber Security, labeled by agency; routine vendor patch notices left out.
group: Security
sources:
  - type: rss
    url:
      - https://cert.europa.eu/publications/security-advisories-rss
      - https://www.jpcert.or.jp/english/rss/jpcert-en.rdf
      - "https://www.cyber.gc.ca/api/cccs/rss/v1/get?feed=alerts_advisories&lang=en"
operators:
  - {type: filter, expr: 'not (title matches "\\(AV\\d+-\\d+\\)")'}   # routine vendor patch notices
  - type: map
    assign:
      - 'agency=replace(source_url, "^https?://(?:www\\.)?([^/]+).*$", "\\1")'
      - 'agency=replace(replace(replace(agency, "^cert\\.europa\\.eu$", "CERT-EU"), "^jpcert\\.or\\.jp$", "JPCERT/CC"), "^cyber\\.gc\\.ca$", "Canadian Centre for Cyber Security")'
      - 'title=agency + ": " + title'
  - {type: sort, by: [published_at], reverse: true}
  - {type: diff, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/security-advisories.xml, title: "Security advisories (CERT-EU, JPCERT/CC, Canada)"}
  - {type: feed, path: ../public/security-advisories.json, title: "Security advisories (CERT-EU, JPCERT/CC, Canada)"}

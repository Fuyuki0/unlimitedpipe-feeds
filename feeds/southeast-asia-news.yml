name: southeast-asia-news
description: "Southeast Asia news in English: Vietnam (VnExpress International), the Philippines (Rappler), Singapore and the region (CNA) and Indonesia (Antara), merged, newest first."
group: World and regions
sources:
  - type: rss
    url:
      - https://e.vnexpress.net/rss/news.rss
      - https://www.rappler.com/feed/
      - https://www.channelnewsasia.com/rssfeeds/8395986
      - https://en.antaranews.com/rss/news.xml
operators:
  - type: map
    assign:
      - 'outlet=replace(source_url, "^https?://(?:www\\d?\\.|en\\.|e\\.|feeds\\.)?([^/]+).*$", "\\1")'
      - 'outlet=replace(outlet, "^vnexpress\\.net$", "VnExpress (Vietnam)")'
      - 'outlet=replace(outlet, "^rappler\\.com$", "Rappler (Philippines)")'
      - 'outlet=replace(outlet, "^channelnewsasia\\.com$", "CNA (Singapore)")'
      - 'outlet=replace(outlet, "^antaranews\\.com$", "Antara (Indonesia)")'
      - 'title=outlet + ": " + title'
  - {type: dedupe, by: [link]}
  - {type: sort, by: [published_at], reverse: true}
  - {type: diff, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/southeast-asia-news.xml, title: "Southeast Asia news (VnExpress, Rappler, CNA, Antara)", max_items: 150}
  - {type: feed, path: ../public/southeast-asia-news.json, title: "Southeast Asia news (VnExpress, Rappler, CNA, Antara)", max_items: 150}

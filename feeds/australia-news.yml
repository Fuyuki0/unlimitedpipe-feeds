name: australia-news
description: "Australia news from ABC News, the public broadcaster."
group: Countries
sources:
  - type: rss
    url:
      - https://www.abc.net.au/news/feed/51120/rss.xml
operators:
  - type: map
    assign:
      - 'outlet=replace(source_url, "^https?://(?:www\\d?\\.|en\\.|e\\.|feeds\\.)?([^/]+).*$", "\\1")'
      - 'outlet=replace(outlet, "^abc\\.net\\.au$", "ABC News")'
      - 'title=outlet + ": " + title'
  - {type: dedupe, by: [link]}
  - {type: sort, by: [published_at], reverse: true}
  - {type: diff, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/australia-news.xml, title: "Australia news (ABC)", max_items: 150}
  - {type: feed, path: ../public/australia-news.json, title: "Australia news (ABC)", max_items: 150}

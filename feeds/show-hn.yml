name: show-hn
description: Show HN projects that reached 100 points, from the official Hacker News search API.
group: Developers
sources:
  - type: web
    url: "https://hn.algolia.com/api/v1/search_by_date?tags=show_hn&numericFilters=points%3E100&hitsPerPage=50"
    records: hits
operators:
  - type: map
    assign: ['hn="https://news.ycombinator.com/item?id=" + objectID']
  - type: select
    fields: [title, link=url|hn, hn, published_at=created_at, points, num_comments]
  - {type: diff, key: hn, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/show-hn.xml, title: Show HN (100+ points), link: https://news.ycombinator.com/show}
  - {type: feed, path: ../public/show-hn.json, title: Show HN (100+ points), link: https://news.ycombinator.com/show}

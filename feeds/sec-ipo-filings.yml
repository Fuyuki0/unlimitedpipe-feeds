name: sec-ipo-filings
description: Companies filing to go public in the US (new SEC S-1 and F-1 registrations by companies that had filed no annual or quarterly report yet; amendments, public companies and life insurers' annuities left out), from EDGAR.
sources:
  - type: sec
    resource: ipo-filings
    contact: ${SEC_CONTACT}   # the SEC asks automated readers for a contact email
    since: ${DAYS_AGO_7}
    until: ${TODAY}
operators:
  - {type: sort, by: [filed_at], reverse: true}
  - {type: diff, key: accession, only: [added], emit_initial: true, remember: true}
outputs:
  - {type: feed, path: ../public/sec-ipo-filings.xml, title: IPO filings (SEC S-1 and F-1), link: "https://www.sec.gov/edgar/search/"}
  - {type: feed, path: ../public/sec-ipo-filings.json, title: IPO filings (SEC S-1 and F-1), link: "https://www.sec.gov/edgar/search/"}

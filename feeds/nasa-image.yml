name: nasa-image
description: NASA's Image of the Day.
group: Science and space
sources:
  - type: rss
    url: https://www.nasa.gov/feeds/iotd-feed/
operators:
  - {type: diff, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/nasa-image.xml, title: NASA Image of the Day, link: https://www.nasa.gov/image-of-the-day/}
  - {type: feed, path: ../public/nasa-image.json, title: NASA Image of the Day, link: https://www.nasa.gov/image-of-the-day/}

name: space-weather
description: "Solar storms from NOAA's Space Weather Prediction Center - geomagnetic storms (G), solar radiation storms (S) and radio blackouts (R) that can disturb power grids, GPS, radio and satellites - with the expected impacts."
group: Science and space
sources:
  - type: web
    url: https://services.swpc.noaa.gov/products/alerts.json
operators:
  - {type: filter, expr: 'message matches "NOAA Scale: [GSR]\\d"'}
  - type: map
    assign:
      - 'headline=trim(replace(message, "(?s)^.*?\\n((?:ALERT|WARNING|WATCH|EXTENDED WARNING|SUMMARY|CANCEL \\w+)[^\\n]*).*$", "\\1"))'
      - 'scale=trim(replace(message, "(?s)^.*?NOAA Scale: ([^\\r\\n]+).*$", "\\1"))'
      - 'kind=replace(replace(replace(scale, "^G.*$", "geomagnetic storm"), "^S.*$", "solar radiation storm"), "^R.*$", "radio blackout from a solar flare")'
      - 'title="Solar storm, " + kind + " " + replace(scale, " - ", ", ") + ": " + headline'
      - 'when=trim(replace(message, "(?s)^(?:.*?((?:Valid From|Threshold Reached|Begin Time): [^\\r\\n]*(?:\\s+(?:Valid To|End Time): [^\\r\\n]*)?))?.*$", "\\1"))'
      - 'impacts=trim(replace(replace(message, "(?s)^(?:.*?Potential Impacts: (.*))?.*$", "\\1"), "\\s+", " "))'
      - 'summary=trim(replace(when, "\\s+", " ") + ". " + impacts)'
      - 'published_at=date(issue_datetime)'
      - 'link="https://www.swpc.noaa.gov/"'
      - 'serial=replace(message, "(?s)^.*?Message Code: (\\S+).*?Serial Number: (\\d+).*$", "\\1-\\2")'
  - {type: select, fields: [title, summary, link, published_at, serial]}
  - {type: sort, by: [published_at], reverse: true}
  - {type: diff, key: serial, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/space-weather.xml, title: "Space weather: solar storms (NOAA SWPC)", link: "https://www.swpc.noaa.gov/"}
  - {type: feed, path: ../public/space-weather.json, title: "Space weather: solar storms (NOAA SWPC)", link: "https://www.swpc.noaa.gov/"}

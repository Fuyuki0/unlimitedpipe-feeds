name: crypto-releases
description: New releases of the software that runs the big networks - Bitcoin Core, Lightning (lnd), Ethereum's Geth and Lighthouse clients, and Solana's Agave validator - from GitHub's API.
group: Crypto
sources:
  - type: github
    resource: releases
    repo: [bitcoin/bitcoin, lightningnetwork/lnd, ethereum/go-ethereum, sigp/lighthouse, anza-xyz/agave]
    limit: 5
operators:
  - {type: filter, expr: 'not prerelease and not (tag matches "(?i)-(rc|alpha|beta)")'}
  - type: map
    assign: ['title=repo + " " + tag + ": " + title']
  - {type: sort, by: [published_at], reverse: true}
  - {type: diff, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/crypto-releases.xml, title: Blockchain client releases, link: https://github.com/}
  - {type: feed, path: ../public/crypto-releases.json, title: Blockchain client releases, link: https://github.com/}

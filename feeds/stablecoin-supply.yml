name: stablecoin-supply
description: Big daily moves in the supply of the largest stablecoins (USDT, USDC and others over $1B) - $100M or more minted or burned in a day, from DefiLlama. Data, not investment advice.
group: Crypto
sources:
  - type: web
    url: "https://stablecoins.llama.fi/stablecoins?includePrices=false"
    records: peggedAssets
operators:
  - type: map
    assign:
      - "supply=circulating.peggedUSD"
      - "change=circulating.peggedUSD - circulatingPrevDay.peggedUSD"
  - {type: filter, expr: 'supply >= 1000000000 and abs(change) >= 100000000'}
  - type: map
    assign:
      - 'moved=replace(replace(short(change), "^(-?)", "\\1$"), "^\\$", "+$")'
      - 'title=symbol + " " + replace(replace(moved, "^\\+\\$", "minted $"), "^-\\$", "burned $") + " in a day, supply now $" + short(supply)'
      - 'summary=name + " (" + symbol + "): " + moved + " in 24 hours; week before: $" + short(circulatingPrevWeek.peggedUSD) + "."'
      - 'link="https://defillama.com/stablecoin/" + gecko_id'
      - 'day_key=symbol + " ${TODAY}"'   # one move a coin a day, not one each run
    drop: [chainCirculating, chains, circulatingPrevMonth]
  - {type: diff, key: day_key, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/stablecoin-supply.xml, title: Stablecoin supply moves (DefiLlama), link: "https://defillama.com/stablecoins"}
  - {type: feed, path: ../public/stablecoin-supply.json, title: Stablecoin supply moves (DefiLlama), link: "https://defillama.com/stablecoins"}

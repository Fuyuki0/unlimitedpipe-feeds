name: science-news
description: "Science news from Nature, New Scientist and ScienceDaily: discoveries, research policy and the people behind them."
group: Science and space
sources:
  - type: rss
    url:
      - "https://www.nature.com/nature.rss"
      - "https://www.sciencedaily.com/rss/all.xml"
      - "https://www.newscientist.com/feed/home/"
operators:
  - type: map
    assign:
      - 'journal=replace(replace(replace(source_url, "^.*nature\\.com.*$", "Nature"), "^.*sciencedaily\\.com.*$", "ScienceDaily"), "^.*newscientist\\.com.*$", "New Scientist")'
      - 'title=journal + ": " + title'
  - {type: sort, by: [published_at], reverse: true}
  - {type: dedupe, by: [link]}
  - {type: diff, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/science-news.xml, title: "Science news (Nature, New Scientist, ScienceDaily)", link: "https://www.nature.com/news"}
  - {type: feed, path: ../public/science-news.json, title: "Science news (Nature, New Scientist, ScienceDaily)", link: "https://www.nature.com/news"}

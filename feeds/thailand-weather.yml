name: thailand-weather
description: Weather now and for the next 6 hours in Bangkok, Chiang Mai, Phuket, Pattaya, Khon Kaen and Hat Yai, twice a day (พยากรณ์อากาศ). Data from MET Norway (CC BY 4.0).
group: Countries
sources:
  - {type: web, url: "https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=13.75&lon=100.50"}
  - {type: web, url: "https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=18.79&lon=98.98"}
  - {type: web, url: "https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=7.88&lon=98.39"}
  - {type: web, url: "https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=12.93&lon=100.88"}
  - {type: web, url: "https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=16.43&lon=102.83"}
  - {type: web, url: "https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=7.01&lon=100.47"}
operators:
  - type: map
    assign:
      - 'city=replace(source_url, "^.*lat=([\\d.]+)&.*$", "\\1")'
      - 'city=replace(city, "^13\\.75$", "Bangkok")'
      - 'city=replace(city, "^18\\.79$", "Chiang Mai")'
      - 'city=replace(city, "^7\\.88$", "Phuket")'
      - 'city=replace(city, "^12\\.93$", "Pattaya")'
      - 'city=replace(city, "^16\\.43$", "Khon Kaen")'
      - 'city=replace(city, "^7\\.01$", "Hat Yai")'
      - "now=properties.timeseries.0.data"
      - 'sky=replace(now.next_12_hours.summary.symbol_code, "_(day|night|polartwilight)$", "")'
      - 'sky=replace(replace(replace(sky, "andthunder$", " and thunder"), "showers", " showers"), "^(light|heavy)", "\\1 ")'
      - 'sky=replace(replace(sky, "^clearsky$", "clear sky"), "^partlycloudy$", "partly cloudy")'
      - 'title=city + ": " + sky + ", " + round(now.instant.details.air_temperature) + "°C now"'
      - 'summary="Next 6 hours: " + round(now.next_6_hours.details.air_temperature_min) + "–" + round(now.next_6_hours.details.air_temperature_max) + "°C, " + now.next_6_hours.details.precipitation_amount + " mm of rain, humidity " + round(now.instant.details.relative_humidity) + "%. Forecast by MET Norway."'
      - "published_at=properties.meta.updated_at"
      - 'link="https://www.yr.no/en/forecast/daily-table/" + replace(source_url, "^.*lat=([\\d.]+)&lon=([\\d.]+).*$", "\\1,\\2")'
      - 'period=city + " " + replace(replace(properties.timeseries.0.time, "^(\\d{4}-\\d\\d-\\d\\d)T(0\\d|1[01]).*$", "\\1 morning"), "^(\\d{4}-\\d\\d-\\d\\d)T\\d\\d:.*$", "\\1 evening")'
  - type: select
    fields: [title, summary, published_at, link, period, city, sky]
  - {type: diff, key: period, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/thailand-weather.xml, title: "Thailand weather (MET Norway)", link: "https://www.yr.no/"}
  - {type: feed, path: ../public/thailand-weather.json, title: "Thailand weather (MET Norway)", link: "https://www.yr.no/"}

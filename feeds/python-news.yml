name: python-news
description: Python release announcements (Python Insider) and new PEPs.
group: Developers
sources:
  - type: rss
    url: ["https://blog.python.org/feeds/posts/default?alt=rss", https://peps.python.org/peps.rss]
operators:
  - {type: sort, by: [published_at], reverse: true}
  - {type: diff, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/python-news.xml, title: Python news and PEPs, link: https://www.python.org/}
  - {type: feed, path: ../public/python-news.json, title: Python news and PEPs, link: https://www.python.org/}

name: thailand-news
description: English-language Thailand news from Khaosod English, Thai Enquirer and Prachatai English.
group: Countries
sources:
  - type: rss
    url: [https://www.khaosodenglish.com/feed/, https://www.thaienquirer.com/feed/, https://prachataienglish.com/rss.xml]
operators:
  - {type: sort, by: [published_at], reverse: true}
  - {type: diff, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/thailand-news.xml, title: Thailand news in English}
  - {type: feed, path: ../public/thailand-news.json, title: Thailand news in English}

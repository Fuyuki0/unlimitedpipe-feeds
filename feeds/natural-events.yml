name: natural-events
description: "Natural events happening now, tracked by NASA EONET: wildfires, severe storms, volcanoes, floods, icebergs and more, each with the agency that reported it."
group: Disasters and health
sources:
  - type: web
    url: "https://eonet.gsfc.nasa.gov/api/v3/events?status=open&days=14"
    records: events
operators:
  - type: map
    assign:
      - 'kind=categories.0.title'
      - 'title=kind + ": " + title'
      - 'summary="Reported by " + sources.0.id + ", first seen " + replace("" + geometry.0.date, "T.*$", "") + ". Tracked by NASA EONET."'
      - 'published_at=geometry.0.date'
      - 'link=sources.0.url'
  - {type: select, fields: [title, summary, link, published_at, id, kind]}
  - {type: sort, by: [published_at], reverse: true}
  - {type: diff, key: id, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/natural-events.xml, title: "Natural events now (NASA EONET)", link: "https://eonet.gsfc.nasa.gov/"}
  - {type: feed, path: ../public/natural-events.json, title: "Natural events now (NASA EONET)", link: "https://eonet.gsfc.nasa.gov/"}

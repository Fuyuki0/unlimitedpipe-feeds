name: earthquakes
description: Earthquakes of magnitude 4.5 and above worldwide, from the US Geological Survey.
sources:
  - type: web
    url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson
    records: features
operators:
  - type: map
    assign:
      - "title=properties.title"
      - "link=properties.url"
      - 'summary="Magnitude " + properties.mag + ", " + properties.place'
      - "published_at=date(properties.time)"
    drop: [geometry, properties, type]
  - {type: diff, key: id, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/earthquakes.xml, title: Significant earthquakes (USGS), link: https://earthquake.usgs.gov/earthquakes/map/}
  - {type: feed, path: ../public/earthquakes.json, title: Significant earthquakes (USGS), link: https://earthquake.usgs.gov/earthquakes/map/}

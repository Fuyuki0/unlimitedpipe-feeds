name: world-events
description: "What happened in the world each day, event by event, from Wikipedia's Current events portal - conflicts, disasters, elections, business, law, science and sport - with the topic and the news reports each event cites. History since 2002. Text from Wikipedia, CC BY-SA 4.0."
group: World and regions
sources:
  - type: current-events
    days: 2
operators:
  - {type: diff, only: [added], emit_initial: true, namespace: world-events, remember: true}
outputs:
  - {type: feed, path: ../public/world-events.xml, title: "World events (Wikipedia Current events)", link: "https://en.wikipedia.org/wiki/Portal:Current_events", max_items: 150}
  - {type: feed, path: ../public/world-events.json, title: "World events (Wikipedia Current events)", link: "https://en.wikipedia.org/wiki/Portal:Current_events", max_items: 150}

name: fda-news
description: "US Food and Drug Administration press releases: drug and device approvals, safety warnings, recalls and enforcement."
group: Disasters and health
sources:
  - type: rss
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml
operators:
  - {type: dedupe, by: [link]}
  - {type: sort, by: [published_at], reverse: true}
  - {type: diff, only: [added], emit_initial: true}
outputs:
  - {type: feed, path: ../public/fda-news.xml, title: "FDA press releases", link: "https://www.fda.gov/news-events/fda-newsroom/press-announcements"}
  - {type: feed, path: ../public/fda-news.json, title: "FDA press releases", link: "https://www.fda.gov/news-events/fda-newsroom/press-announcements"}
